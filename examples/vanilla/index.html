<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass — Vanilla example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: url('https://picsum.photos/1600/1000') center / cover fixed,
          #1a1a2e;
      }
      .glass {
        width: 360px;
        height: 220px;
        border-radius: 28px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 1.25rem;
        letter-spacing: 0.02em;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .controls {
        position: fixed;
        top: 16px;
        left: 16px;
        display: grid;
        gap: 8px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-size: 13px;
      }
      .controls label {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="glass">Liquid Glass</div>

    <div class="controls">
      <label>bezel <input id="bezel" type="range" min="2" max="48" value="16" /></label>
      <label>radius <input id="radius" type="range" min="0" max="80" value="28" /></label>
      <label>blur <input id="blur" type="range" min="0" max="10" value="2" /></label>
    </div>

    <!--
      During development this resolves to the workspace package via the bundler.
      For a quick static preview, build @liquid-glass/core and point this import
      at its dist/index.js.
    -->
    <script type="module">
      import { liquidGlass } from '@liquid-glass/core';

      const el = document.querySelector('.glass');
      const handle = liquidGlass(el, { radius: 28, bezel: 16, blur: 2, surface: 'convex' });

      const bind = (id, key) =>
        document.getElementById(id).addEventListener('input', (e) =>
          handle.update({ [key]: Number(e.target.value) }),
        );
      bind('bezel', 'bezel');
      bind('radius', 'radius');
      bind('blur', 'blur');
    </script>
  </body>
</html>
