name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Typecheck wrappers
        run: pnpm --filter @liquid-glass/element lint && pnpm --filter @liquid-glass/react lint
      - name: Lint UI CSS
        run: pnpm --filter @liquid-glass/ui lint:css
      - name: Build docs
        run: pnpm docs:build
